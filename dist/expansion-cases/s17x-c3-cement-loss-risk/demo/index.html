<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固井漏失风险预测</title><link rel="stylesheet" href="demo.css"></head><body><main><header><span class="eyebrow">井见 / 固井 / C3</span><h1>压力裕度相同，为什么两口井的漏失风险还会不同？</h1><p class="lead">调整压力裕度和判定阈值，比较多变量风险筛查与单压力裕度规则的漏报、误报。</p><p class="small">方法：多变量逻辑回归 + 阈值权衡 · 固定种子教学数据 · 浏览器离线计算</p></header><nav aria-label="案例内容"><button data-tab="background">专业背景</button><button data-tab="workflow">案例流程</button><button data-tab="lab">可运行示范</button></nav><section id="background"><div id="background-content"></div><article class="lesson"><h2>专业概念来源与数据说明</h2><p>专业概念参考 <a href="https://www.slb.com/resource-library/oilfield-review/defining-series/defining-cementing" target="_blank" rel="noopener">SLB 官方专业资料</a>。图表为本案例绘制；数值样本由明示关系与固定种子生成，用于观察变量关系和比较方法，不作为现场统计数据。</p></article></section><section id="workflow" hidden><div id="stepnav" class="stepnav"></div><article id="step-content" class="panel stepbody workflow-step"></article></section><section id="lab" hidden><div class="controls"><label>报警阈值 <output id="threshold-out"></output><input data-param id="threshold" type="range" min="0.1" max="0.9" step="0.05" value="0.5"></label><label>留出井压力裕度偏移 / MPa <output id="shift-out"></output><input data-param id="shift" type="range" min="-2" max="2" step="0.2" value="0"></label><label>裂缝指数增加 <output id="fracture-out"></output><input data-param id="fracture" type="range" min="0" max="0.4" step="0.05" value="0"></label></div><div class="toolbar"><button id="run" class="primary">运行计算</button><button id="reset">恢复默认</button><button id="export" disabled>下载本次结果 JSON</button></div><div id="status" class="status" role="status">调整参数后运行，查看数据、模型与基线的同条件对照。</div><div id="results"><p class="note">运行后显示当前参数下的分析图表。</p></div></section></main><footer>学号 17 · 固井漏失风险预测 · v1.1.0 · 纯前端离线案例</footer><script src="demo.js"></script></body></html>
