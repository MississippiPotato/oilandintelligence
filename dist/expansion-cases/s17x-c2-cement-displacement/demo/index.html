<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注水泥参数优化</title><link rel="stylesheet" href="demo.css"></head><body><main><header><span class="eyebrow">井见 / 固井 / C2</span><h1>排量加大到什么程度，才能兼顾置换与压力窗口？</h1><p class="lead">把置换效率和环空压力放在同一张候选图上，观察压力上限怎样改变可选排量与浆体密度。</p><p class="small">方法：双输出岭回归 + 约束网格搜索 · 固定种子教学数据 · 浏览器离线计算</p></header><nav aria-label="案例内容"><button data-tab="background">专业背景</button><button data-tab="workflow">案例流程</button><button data-tab="lab">可运行示范</button></nav><section id="background"><div id="background-content"></div><article class="lesson"><h2>专业概念来源与数据说明</h2><p>专业概念参考 <a href="https://www.slb.com/resource-library/oilfield-review/defining-series/defining-cementing" target="_blank" rel="noopener">SLB 官方专业资料</a>。图表为本案例绘制；数值样本由明示关系与固定种子生成，用于观察变量关系和比较方法，不作为现场统计数据。</p></article></section><section id="workflow" hidden><div id="stepnav" class="stepnav"></div><article id="step-content" class="panel stepbody workflow-step"></article></section><section id="lab" hidden><div class="controls"><label>偏心比例 <output id="ecc-out"></output><input data-param id="ecc" type="range" min="0" max="0.8" step="0.05" value="0.35"></label><label>压力上限 / MPa <output id="pressureLimit-out"></output><input data-param id="pressureLimit" type="range" min="43" max="65" step="0.5" value="54"></label><label>泵量上限 / m³/min <output id="qmax-out"></output><input data-param id="qmax" type="range" min="0.6" max="2.5" step="0.1" value="2.4"></label></div><div class="toolbar"><button id="run" class="primary">运行计算</button><button id="reset">恢复默认</button><button id="export" disabled>下载本次结果 JSON</button></div><div id="status" class="status" role="status">调整参数后运行，查看数据、模型与基线的同条件对照。</div><div id="results"><p class="note">运行后显示当前参数下的分析图表。</p></div></section></main><footer>学号 17 · 注水泥参数优化 · v1.0.1 · 纯前端离线案例</footer><script src="demo.js"></script></body></html>
