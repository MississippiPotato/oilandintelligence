<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完井管柱受力智能分析</title><link rel="stylesheet" href="demo.css"></head><body><main><header><span class="eyebrow">井见 / 完井 / CO3</span><h1>温升、压差和悬挂载荷一起变化，哪段管柱更接近应力限制？</h1><p class="lead">沿 2500 m 管柱对照轴向、环向与等效应力，切换温度约束，理解为何简单拉力基线会遗漏风险。</p><p class="small">方法：应力分量回归 + 等效应力计算 · 固定种子教学数据 · 浏览器离线计算</p></header><nav aria-label="案例内容"><button data-tab="background">专业背景</button><button data-tab="workflow">案例流程</button><button data-tab="lab">可运行示范</button></nav><section id="background"><div id="background-content"></div><article class="lesson"><h2>专业概念来源与数据说明</h2><p>专业概念参考 <a href="https://www.slb.com/resource-library/oilfield-review/defining-series/defining-completion" target="_blank" rel="noopener">SLB 官方专业资料</a>。图表为本案例绘制；数值样本由明示关系与固定种子生成，用于观察变量关系和比较方法，不作为现场统计数据。</p></article></section><section id="workflow" hidden><div id="stepnav" class="stepnav"></div><article id="step-content" class="panel stepbody workflow-step"></article></section><section id="lab" hidden><div class="controls"><label>顶部悬挂载荷 / kN <output id="force-out"></output><input data-param id="force" type="range" min="700" max="1800" step="50" value="1100"></label><label>井底温升 / °C <output id="temperature-out"></output><input data-param id="temperature" type="range" min="0" max="150" step="5" value="60"></label><label>井底内外压差 / MPa <output id="pressure-out"></output><input data-param id="pressure" type="range" min="4" max="30" step="1" value="18"></label><label>轴向约束（0 自由 / 1 受限） <output id="anchor-out"></output><input data-param id="anchor" type="range" min="0" max="1" step="1" value="1"></label></div><div class="toolbar"><button id="run" class="primary">运行计算</button><button id="reset">恢复默认</button><button id="export" disabled>下载本次结果 JSON</button></div><div id="status" class="status" role="status">调整参数后运行，查看数据、模型与基线的同条件对照。</div><div id="results"><p class="note">运行后显示当前参数下的分析图表。</p></div></
