<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>套管居中度智能评估</title><link rel="stylesheet" href="demo.css"></head><body><main><header><span class="eyebrow">井见 / 固井 / C4</span><h1>截面看起来居中，受载后最窄的环空会在哪里？</h1><p class="lead">改变偏心、侧向载荷与扶正器跨距，观察截面间隙及支撑之间的下垂，比较有载与无载评估。</p><p class="small">方法：受载间隙回归 + 扶正跨距比较 · 固定种子教学数据 · 浏览器离线计算</p></header><nav aria-label="案例内容"><button data-tab="background">专业背景</button><button data-tab="workflow">案例流程</button><button data-tab="lab">可运行示范</button></nav><section id="background"><div id="background-content"></div><article class="lesson"><h2>专业概念来源与数据说明</h2><p>专业概念参考 <a href="https://glossary.slb.com/terms/c/centralizer" target="_blank" rel="noopener">SLB 官方专业资料</a>。图表为本案例绘制；数值样本由明示关系与固定种子生成，用于观察变量关系和比较方法，不作为现场统计数据。</p></article></section><section id="workflow" hidden><div id="stepnav" class="stepnav"></div><article id="step-content" class="panel stepbody workflow-step"></article></section><section id="lab" hidden><div class="controls"><label>初始偏心 / mm <output id="ecc-out"></output><input data-param id="ecc" type="range" min="0" max="20" step="1" value="12"></label><label>侧向载荷指数 <output id="load-out"></output><input data-param id="load" type="range" min="0.5" max="2" step="0.1" value="1.3"></label><label>扶正器跨距 / m <output id="spacing-out"></output><input data-param id="spacing" type="range" min="6" max="18" step="1" value="12"></label></div><div class="toolbar"><button id="run" class="primary">运行计算</button><button id="reset">恢复默认</button><button id="export" disabled>下载本次结果 JSON</button></div><div id="status" class="status" role="status">调整参数后运行，查看数据、模型与基线的同条件对照。</div><div id="results"><p class="note">运行后显示当前参数下的分析图表。</p></div></section></main><footer>学号 17 · 套管居中度智能评估 · v1.0.0 · 纯前端离线案例</footer><script src="demo.js"></script></body></html>
