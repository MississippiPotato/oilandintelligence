<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能完井滑套控制策略</title><link rel="stylesheet" href="demo.css"></head><body><main><header><span class="eyebrow">井见 / 完井 / CO4</span><h1>处理能力有限时，先调哪一段滑套，才能减少水又保留油？</h1><p class="lead">比较三段滑套逐日开度、油水贡献和固定全开策略，观察动作频次限制怎样影响调节速度。</p><p class="small">方法：分段响应回归 + 受限动作搜索 · 固定种子教学数据 · 浏览器离线计算</p></header><nav aria-label="案例内容"><button data-tab="background">专业背景</button><button data-tab="workflow">案例流程</button><button data-tab="lab">可运行示范</button></nav><section id="background"><div id="background-content"></div><article class="lesson"><h2>专业概念来源与数据说明</h2><p>专业概念参考 <a href="https://www.slb.com/resource-library/oilfield-review/defining-series/defining-intelligent-completions" target="_blank" rel="noopener">SLB 官方专业资料</a>。图表为本案例绘制；数值样本由明示关系与固定种子生成，用于观察变量关系和比较方法，不作为现场统计数据。</p></article></section><section id="workflow" hidden><div id="stepnav" class="stepnav"></div><article id="step-content" class="panel stepbody workflow-step"></article></section><section id="lab" hidden><div class="controls"><label>水处理偏好系数 <output id="penalty-out"></output><input data-param id="penalty" type="range" min="0" max="1.5" step="0.1" value="0.6"></label><label>地面处理能力 / m³/d <output id="capacity-out"></output><input data-param id="capacity" type="range" min="50" max="220" step="10" value="150"></label><label>每日最多调整分段数 <output id="changes-out"></output><input data-param id="changes" type="range" min="1" max="3" step="1" value="1"></label></div><div class="toolbar"><button id="run" class="primary">运行计算</button><button id="reset">恢复默认</button><button id="export" disabled>下载本次结果 JSON</button></div><div id="status" class="status" role="status">调整参数后运行，查看数据、模型与基线的同条件对照。</div><div id="results"><p class="note">运行后显示当前参数下的分析图表。</p></div></section></main><footer>学号 17 · 智能完井滑套控制策略 · v1.0.0 · 纯前端离线案例</footer><script src="demo.js"></script></body></html>
