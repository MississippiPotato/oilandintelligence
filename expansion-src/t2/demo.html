<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管道腐蚀评估：先找对缺陷，再谈增长</title><link rel="stylesheet" href="demo.css"></head><body><header>井见 · 运输 / t2</header><main><h1>管道腐蚀评估：先找对缺陷，再谈增长</h1><p class="intro">两次智能清管记录中的同一处金属损失，位置可能并不完全重合。先把两次记录配准、匹配，再用壁厚损失的变化筛选优先开挖位置。</p><nav><button data-tab="background">专业背景</button><button data-tab="workflow">案例流程</button><button data-tab="lab">可运行示范</button></nav><section id="background" hidden><div id="background-content"></div></section><section id="workflow" hidden><div id="workflow-content"></div></section><section id="lab"><article><h2>哪一处缺陷增长快，值得优先复测？</h2><p>拖动参数，观察计算结果如何改变。数据为固定种子教学夹具；曲线和指标均在当前页面计算。</p><div class="controls"><label>第二次里程偏移 <output id="shift-value">7</output> m<input id="shift" data-param type="range" min="0" max="14" step="1" value="7"></label><label>测深误差倍率 <output id="noise-value">1</output> <input id="noise" data-param type="range" min="0" max="3" step="0.25" value="1"></label><label>两次检测间隔 <output id="years-value">3</output> 年<input id="years" data-param type="range" min="1" max="6" step="1" value="3"></label></div><p class="toolbar"><button id="run" class="primary">运行计算</button><button id="reset">恢复默认</button><button id="export" disabled>导出本轮计算</button></p><div id="status" class="status" role="status">先运行，查看本轮图表与计算。</div></article><div id="results" aria-live="polite"></div></section></main><footer>s17x-t2-corrosion-growth · v1.0.0 · 纯前端离线运行</footer><script src="demo.js"></script></body></html>
