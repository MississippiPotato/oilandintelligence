<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>常减压操作优化：收率、质量与能耗的边界</title><link rel="stylesheet" href="demo.css"></head><body><main><header><div class="eyebrow">炼油与智能决策 · R1</div><h1>常减压操作优化：收率、质量与能耗的边界</h1><p>同一原油批次，为什么不能只把炉温调高？先读懂分馏与质量约束，再用实际拟合的代理模型寻找可行操作点。</p></header><nav aria-label="案例章节"><button data-tab="background" aria-pressed="true">专业背景</button><button data-tab="workflow" aria-pressed="false">案例流程</button><button data-tab="lab" aria-pressed="false">可运行示范</button></nav><section id="background"><div id="background-content"></div></section><section id="workflow" hidden><div id="workflow-content"></div></section><section id="lab" hidden><article class="card"><h2>设定当前工况与约束</h2><p>改变参数后点击“重新计算”。每次都从训练批次实际拟合模型，再生成当前预测和独立评价。</p><div class="controls"><label>减压塔绝压（kPa）<input data-param id="pressure" type="range" min="5" max="11" step="0.2" value="8"><output for="pressure"></output></label><label>能耗上限（GJ/t）<input data-param id="energyLimit" type="range" min="1.3" max="2.2" step="0.02" value="1.85"><output for="energyLimit"></output></label><label>柴油终馏点上限（°C）<input data-param id="endpointLimit" type="range" min="338" max="356" step="0.5" value="348"><output for="endpointLimit"></output></label></div><p><button id="run">重新计算</button> <button id="export" disabled>导出本次结果</button></p><div id="status" role="status">尚未运行</div></article><article class="card" id="results" hidden><h2>961组候选：哪些操作还在可行域内？</h2><p>横轴为炉出口温度，纵轴为回流比；灰色表示至少一项约束越界。绿色越深表示预测回收率越高，橙色外框是最终推荐点。</p><div id="grid-chart" class="chart"></div><div id="summary"></div><h2>推荐点与固定操作点</h2><div id="comparison"></div><h2>模型学到关系了吗？看48条独立测试工况</h2><div id="validation"></div><div id="test-chart" class="chart"></div><p class="note">教学数据与公式随案例离线提供；误差在留出批次计算，当前工况预测不读取其评价真值。</p></article></section></main><script src="demo.js"></script></body></html>
