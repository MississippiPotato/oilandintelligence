<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>射孔参数智能设计</title><link rel="stylesheet" href="demo.css"></head><body><main><header><span class="eyebrow">井见 / 完井 / CO2</span><h1>四个层段该怎样组合射开，才不会把油层与高含水层一起选错？</h1><p class="lead">本例关注完井选层组合：调预算、含水上限和层间隔离条件，查看每个组合为何留下或被排除。</p><p class="small">方法：知识约束传播 + 完整组合搜索 · 固定种子教学数据 · 浏览器离线计算</p></header><nav aria-label="案例内容"><button data-tab="background">专业背景</button><button data-tab="workflow">案例流程</button><button data-tab="lab">可运行示范</button></nav><section id="background"><div id="background-content"></div><article class="lesson"><h2>专业概念来源与数据说明</h2><p>专业概念参考 <a href="https://www.slb.com/resource-library/oilfield-review/defining-series/defining-completion" target="_blank" rel="noopener">SLB 官方专业资料</a>。图表为本案例绘制；数值样本由明示关系与固定种子生成，用于观察变量关系和比较方法，不作为现场统计数据。</p></article></section><section id="workflow" hidden><div id="stepnav" class="stepnav"></div><article id="step-content" class="panel stepbody workflow-step"></article></section><section id="lab" hidden><div class="controls"><label>射孔资源预算 / 指数 <output id="budget-out"></output><input data-param id="budget" type="range" min="10" max="65" step="1" value="42"></label><label>允许总含水率 <output id="waterLimit-out"></output><input data-param id="waterLimit" type="range" min="0.15" max="0.8" step="0.05" value="0.4"></label><label>分层隔离条件（0 无 / 1 有） <output id="isolation-out"></output><input data-param id="isolation" type="range" min="0" max="1" step="1" value="1"></label></div><div class="toolbar"><button id="run" class="primary">运行计算</button><button id="reset">恢复默认</button><button id="export" disabled>下载本次结果 JSON</button></div><div id="status" class="status" role="status">调整参数后运行，查看数据、模型与基线的同条件对照。</div><div id="results"><p class="note">运行后显示当前参数下的分析图表。</p></div></section></main><footer>学号 17 · 射孔参数智能设计 · v1.0.0 · 纯前端离线案例</footer><script src="demo.js"></script></body></html>
